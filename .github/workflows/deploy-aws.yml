name: Deploy to AWS

# App-image-only redeploy: build docker/server.aws.Dockerfile, push to ECR,
# force a new ECS deployment. Infra changes (packages/cdk) are NOT run here --
# cdk deploy stays a deliberate, human-run step. See LYF2-263 and
# examples/medplum-provider/docs/aws-architecture.md for why.
#
# This file lives in SkaFld-Ignite/lyfe-ai-medplum (the real upstream) and
# reaches Lyfe-AI/lyfe-ai-medplum via mirror.yml's force-sync, which also
# means a push to main fires this workflow's `on: push` in BOTH repos. Only
# Lyfe-AI's copy can actually deploy -- the IAM role's trust policy is scoped
# to this repo's immutable owner/repo id (the org has GitHub's ID-based OIDC
# subject claims enabled, so it's `repo:Lyfe-AI@<org id>/lyfe-ai-medplum@<repo
# id>:...`, not the plain-name form AWS's own docs show), so SkaFld-Ignite's
# run would just fail the OIDC assume-role step. The job-level `if` below
# skips it there instead, the same way mirror.yml decides which side acts.
on:
  push:
    branches:
      - main

permissions:
  id-token: write # required to mint the OIDC token for sts:AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: us-west-1
  ECR_REPOSITORY: lyfe-medplum-server
  ECS_CLUSTER: lyfe-medplum-production-BackEndCluster6B6DC4A8-NsB5kG926ajT
  ECS_SERVICE: lyfe-medplum-production-BackEndFargateServiceD3B260C0-pGIrPbGSHEum

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.repository == 'Lyfe-AI/lyfe-ai-medplum'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # docker/server.aws.Dockerfile ADDs prebuilt tarballs rather than
      # compiling inside the image -- build:fast produces the dist/ output
      # those tarballs package. It also builds @medplum/app, which bakes
      # these as Vite env vars at build time; their values don't matter here
      # since only packages/server's dist ends up in this image, but an
      # unset one fails the build, so they're set to placeholders exactly as
      # scripts/build-docker-server.sh's own CI caller (.github/workflows/staging.yml) does.
      - name: Build server
        run: npm run build:fast -- --force
        env:
          MEDPLUM_BASE_URL: '__MEDPLUM_BASE_URL__'
          MEDPLUM_CLIENT_ID: '__MEDPLUM_CLIENT_ID__'
          MEDPLUM_REGISTER_ENABLED: '__MEDPLUM_REGISTER_ENABLED__'
          MEDPLUM_AWS_TEXTRACT_ENABLED: '__MEDPLUM_AWS_TEXTRACT_ENABLED__'
          GOOGLE_CLIENT_ID: '__GOOGLE_CLIENT_ID__'
          RECAPTCHA_SITE_KEY: '__RECAPTCHA_SITE_KEY__'

      # Same tarball packaging scripts/build-docker-server.sh does -- not
      # calling that script directly because it's hardcoded to
      # docker/server.Dockerfile and a DockerHub push, neither of which
      # apply here (this account has no dhi.io entitlement, hence the
      # .aws.Dockerfile variant; the registry is ECR, not DockerHub).
      - name: Package server tarballs
        run: |
          tar \
            --no-xattrs \
            -czf medplum-server-metadata.tar.gz \
            package.json \
            package-lock.json \
            packages/bot-layer/package.json \
            packages/ccda/package.json \
            packages/core/package.json \
            packages/definitions/package.json \
            packages/fhir-router/package.json \
            packages/server/package.json

          tar \
            --no-xattrs \
            --exclude='*.ts' \
            --exclude='*.tsbuildinfo' \
            -czf medplum-server-runtime.tar.gz \
            LICENSE.txt \
            NOTICE \
            packages/ccda/dist \
            packages/core/dist \
            packages/definitions/dist \
            packages/fhir-router/dist \
            packages/server/dist

      - name: Build and push server image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -f docker/server.aws.Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Force a new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for the service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
